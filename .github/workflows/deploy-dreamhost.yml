name: Deploy to DreamHost

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: iad1-shared-e1-27.dreamhost.com
          username: ${{ secrets.DREAMHOST_USERNAME }}
          password: ${{ secrets.DREAMHOST_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ${{ secrets.DREAMHOST_PATH }}
          exclude: |
            **/.git*
            **/.github/**
            **/docs/**
            **/supabase/**
            **/README.md
            **/.cursor/**
            **/node_modules/**
            **/_site/**
