name: Deploy to DreamHost

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SFTP (SCP over SSH)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: iad1-shared-e1-27.dreamhost.com
          port: 22
          username: ${{ secrets.DREAMHOST_USERNAME }}
          password: ${{ secrets.DREAMHOST_PASSWORD }}
          source: "index.html,app.html,progress.html,community.html,setup.html,terms.html,privacy.html,faq.html,assets"
          target: ${{ secrets.DREAMHOST_PATH }}
          overwrite: true
