name: Deploy to DreamHost

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via SFTP mirror
        env:
          DREAMHOST_SERVER: iad1-shared-e1-27.dreamhost.com
          DREAMHOST_USERNAME: ${{ secrets.DREAMHOST_USERNAME }}
          DREAMHOST_PASSWORD: ${{ secrets.DREAMHOST_PASSWORD }}
          DREAMHOST_PATH: ${{ secrets.DREAMHOST_PATH }}
        run: |
          lftp -c "
          set sftp:auto-confirm yes;
          set ssl:verify-certificate no;
          open -u ${DREAMHOST_USERNAME},${DREAMHOST_PASSWORD} sftp://${DREAMHOST_SERVER};
          mirror -R ./ ${DREAMHOST_PATH} \
            --verbose \
            --delete \
            --exclude-glob .git* \
            --exclude-glob .github \
            --exclude-glob docs \
            --exclude-glob supabase \
            --exclude-glob README.md \
            --exclude-glob .cursor \
            --exclude-glob node_modules \
            --exclude-glob _site;
          bye
          "
